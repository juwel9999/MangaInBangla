<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Manga Reader</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="controls">
    <select id="chapterSelect" aria-label="Select Chapter"></select>
    <button id="dirBtn" type="button">Mode: RTL (Manga)</button>
    <button id="prevBtn" type="button">Prev</button>
    <button id="nextBtn" type="button">Next</button>
    <a class="upload-link" href="upload.html">Upload</a>
  </header>

  <main class="reader" id="reader">
    <img id="pageImg" src="" alt="Manga Page">
    <div class="page-info" id="pageInfo">Loading...</div>
  </main>

  <script src="script.js"></script>
</body>
</html>
