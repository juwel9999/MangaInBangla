<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Upload Manga Pages</title>
  <style>
    * { box-sizing: border-box; }
    body {
      background: #111;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 16px;
    }
    .container {
      max-width: 540px;
      margin: 0 auto;
      background: #1b1b1b;
      padding: 18px;
      border-radius: 10px;
      border: 1px solid #2e2e2e;
    }
    h1 {
      font-size: 20px;
      margin: 0 0 14px;
    }
    label {
      display: block;
      font-size: 13px;
      color: #bbb;
      margin-top: 12px;
      margin-bottom: 5px;
    }
    input, select, button {
      width: 100%;
      padding: 10px;
      font-size: 15px;
      border-radius: 6px;
      border: 1px solid #444;
      background: #282828;
      color: #fff;
    }
    button {
      margin-top: 16px;
      background: #2563eb;
      border-color: #2563eb;
      font-weight: 600;
      cursor: pointer;
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .status {
      margin-top: 14px;
      padding: 10px;
      border-radius: 6px;
      background: #141414;
      border: 1px solid #2a2a2a;
      font-size: 13px;
      line-height: 1.5;
      white-space: pre-wrap;
      max-height: 220px;
      overflow-y: auto;
    }
    .nav-link {
      display: inline-block;
      margin-bottom: 12px;
      color: #60a5fa;
      text-decoration: none;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="container">
    <a class="nav-link" href="index.html">← Back to Reader</a>
    <h1>Upload Chapter Pages</h1>

    <form id="uploadForm">
      <label for="owner">GitHub Username (Owner)</label>
      <input id="owner" type="text" value="juwel9999" required>

      <label for="repo">Repository Name</label>
      <input id="repo" type="text" value="MangaInBangla" required>

      <label for="branch">Branch</label>
      <input id="branch" type="text" value="main" required>

      <label for="token">Fine-Grained Personal Access Token</label>
      <input id="token" type="password" placeholder="github_pat_..." required>

      <label for="folderPath">Chapter Folder Path</label>
      <input id="folderPath" type="text" value="manga/series-1/ch-1/" required>

      <label for="startPage">Starting Page Number</label>
      <input id="startPage" type="number" min="1" value="1" required>

      <label for="padCount">Filename Digit Padding</label>
      <select id="padCount">
        <option value="2" selected>2 digits (01, 02, ...)</option>
        <option value="3">3 digits (001, 002, ...)</option>
      </select>

      <label for="files">Select Pages from Phone Gallery</label>
      <input id="files" type="file" accept="image/*" multiple required>

      <button id="uploadBtn" type="submit">Upload Pages</button>
    </form>

    <div class="status" id="status">Ready. Select images to upload.</div>
  </div>

  <script>
    const form = document.getElementById("uploadForm");
    const uploadBtn = document.getElementById("uploadBtn");
    const statusBox = document.getElementById("status");

    function logStatus(msg) {
      statusBox.textContent += `\n${msg}`;
      statusBox.scrollTop = statusBox.scrollHeight;
    }

    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => {
          const result = String(reader.result || "");
          const base64 = result.split(",")[1];
          if (!base64) reject(new Error("Could not encode file to Base64"));
          else resolve(base64);
        };
        reader.onerror = () => reject(reader.error || new Error("File read failed"));
        reader.readAsDataURL(file);
      });
    }

    function getExtension(file) {
      const nameParts = file.name.split(".");
      if (nameParts.length > 1) {
        return nameParts.pop().toLowerCase().replace("jpeg", "jpg");
      }
      if (file.type === "image/png") return "png";
      if (file.type === "image/webp") return "webp";
      return "jpg";
    }

    async function getExistingSha(url, token, branch) {
      const res = await fetch(`${url}?ref=${encodeURIComponent(branch)}`, {
        headers: {
          "Authorization": `Bearer ${token}`,
          "Accept": "application/vnd.github+json"
        }
      });
      if (res.status === 404) return null;
      if (!res.ok) {
        const errData = await res.json().catch(() => ({}));
        throw new Error(errData.message || `Lookup failed (${res.status})`);
      }
      const data = await res.json();
      return data.sha || null;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const owner = document.getElementById("owner").value.trim();
      const repo = document.getElementById("repo").value.trim();
      const branch = document.getElementById("branch").value.trim() || "main";
      const token = document.getElementById("token").value.trim();
      let folderPath = document.getElementById("folderPath").value.trim();
      const startPage = Math.max(1, Number(document.getElementById("startPage").value) || 1);
      const padCount = Number(document.getElementById("padCount").value) || 2;
      const files = Array.from(document.getElementById("files").files);

      if (!files.length) return;

      folderPath = folderPath.replace(/^\/+/, "");
      if (!folderPath.endsWith("/")) folderPath += "/";

      uploadBtn.disabled = true;
      statusBox.textContent = `Starting upload of ${files.length} file(s)...`;

      try {
        for (let i = 0; i < files.length; i++) {
          const file = files[i];
          const pageNumber = startPage + i;
          const ext = getExtension(file);
          const fileName = `${String(pageNumber).padStart(padCount, "0")}.${ext}`;
          const fullPath = `${folderPath}${fileName}`;
          const apiUrl = `https://api.github.com/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}/contents/${fullPath}`;

          logStatus(`(${i + 1}/${files.length}) Encoding ${fileName}...`);
          const contentBase64 = await fileToBase64(file);
          const existingSha = await getExistingSha(apiUrl, token, branch);

          const body = {
            message: `Upload ${fullPath}`,
            content: contentBase64,
            branch
          };
          if (existingSha) body.sha = existingSha;

          const putRes = await fetch(apiUrl, {
            method: "PUT",
            headers: {
              "Authorization": `Bearer ${token}`,
              "Accept": "application/vnd.github+json",
              "Content-Type": "application/json"
            },
            body: JSON.stringify(body)
          });

          if (!putRes.ok) {
            const errData = await putRes.json().catch(() => ({}));
            throw new Error(`Failed on ${fileName}: ${errData.message || putRes.status}`);
          }

          logStatus(`✓ Uploaded ${fullPath}`);
        }

        logStatus("\nAll done! Remember to update library.json if this is a new chapter.");
      } catch (err) {
        logStatus(`\nError: ${err.message}`);
      } finally {
        uploadBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
